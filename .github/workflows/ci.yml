name: CI Build Tests

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '30 3 * * 0'

jobs:
  cpp_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            CC: gcc-11
            CXX: g++-11
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: gcc-11

          - os: ubuntu-latest
            CC: gcc-12
            CXX: g++-12
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: gcc-12

          - os: ubuntu-latest
            CC: clang-14
            CXX: clang++-14
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: clang-14

          - os: ubuntu-latest
            CC: clang-15
            CXX: clang++-15
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: clang-15

          - os: ubuntu-latest
            CC: clang-15
            CXX: clang++-15
            CMAKE_CMD: cmake .. -DENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
            NAME: clang-15-sanitizers

          - os: macos-latest
            CC: /opt/homebrew/opt/llvm/bin/clang
            CXX: /opt/homebrew/opt/llvm/bin/clang++
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: clang

          - os: macos-latest
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: AppleClang

          - os: windows-latest
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON
            NAME: msvc

          - os: windows-latest
            CMAKE_CMD: cmake .. -DENABLE_WERROR=ON -G "Unix Makefiles"
            NAME: mingw-gcc

    name: ${{ matrix.os }}-${{ matrix.NAME }} - C++ Test
    env:
      MSBUILD_PATH: "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/MSBuild/Current/Bin"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create Build Directory
        run: mkdir build

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y ${{ matrix.CC }}
          if [[ "${{ matrix.CXX }}" != *"clang"* ]]; then sudo apt install -y ${{ matrix.CXX }}; fi
      - name: Install Dependencies (OSX)
        if: matrix.os == 'macos-latest' && matrix.name != 'AppleClang'
        run: |
          brew cask uninstall --force oclint || true
          brew install llvm || brew upgrade llvm

      - name: Execute CMake Process
        env:
          CC: ${{ matrix.CC }}
          CXX: ${{ matrix.CXX }}
        run: |
          cd build
          ${{ matrix.CMAKE_CMD }}
      - name: Build Project
        run: |
          cd build
          cmake --build . -j

      - name: Run Tests
        run: |
          cd build
          ctest -C Debug --output-on-failure

  fuzz_test:
    runs-on: ubuntu-latest
    name: Fuzz smoke test (10s per target)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Clang 15
        run: |
          sudo apt update
          sudo apt install -y clang-15
      - name: Configure
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_FUZZERS=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build fuzzers
        run: cmake --build build -j
      - name: Run fuzz smoke tests
        run: |
          for fuzzer in build/fuzz_string_parse build/fuzz_arithmetic build/fuzz_bitops build/fuzz_roundtrip build/fuzz_cross_type; do
            echo "=== Running $(basename $fuzzer) ==="
            $fuzzer -max_total_time=10 -print_final_stats=1 2>&1 | tail -10
            echo
          done
